<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14402f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Mis gastos</title>
<style>
:root{--bg:#edf1ea;--card:#fbfcf9;--tx:#13201a;--mu:#667268;--bd:#d9e0d4;--in:#1c8556;--out:#d8453b;--sh:0 10px 24px -18px #13201a99;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1511;--card:#14201b;--tx:#e6efe9;--mu:#8a9b92;--bd:#233229;--in:#52d49b;--out:#ff7f72;--sh:0 10px 24px -16px #000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1,.hero b,.card>b{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{font-size:30px;letter-spacing:-.035em;font-weight:800;margin:6px 0 16px;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden;color:#f3fbf6;border:0;border-radius:10px;padding:20px;
background:repeating-radial-gradient(circle at 100% 0,#ffffff14 0 1.5px,transparent 1.5px 7px),repeating-linear-gradient(115deg,#ffffff0b 0 2px,transparent 2px 9px),linear-gradient(135deg,#1b5a42,#2f8a63);
box-shadow:inset 0 0 0 5px #ffffff22,inset 0 0 0 6px #ffffff40,0 18px 30px -18px #0a3d29;animation:drop .8s cubic-bezier(.2,1.2,.3,1) both}
.hero::before{content:"€";position:absolute;right:6px;top:-34px;font:800 170px/1 "Bricolage Grotesque",system-ui;color:#ffffff12}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff40 50%,transparent 60%);transform:translateX(-100%);animation:shine 1.4s .7s 1 both}
.hero>*{position:relative;z-index:1}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero small{color:#cfe6d8;font-size:13px;display:block}
.hero>div:nth-child(1) small::before{content:"↗ "}.hero>div:nth-child(2) small::before{content:"↙ "}
.hero b{font-weight:700;font-variant-numeric:tabular-nums}
#sI,#sG{font-size:22px}
.bal{grid-column:1/-1;border-top:1px solid #ffffff40;padding-top:12px}
#sB{font-size:42px;letter-spacing:-.03em}
.hero .in{color:#fff}.hero .out{color:#ffd3cb}
.in{color:var(--in)}.out{color:var(--out)}.mu{color:var(--mu);font-size:13px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.7,.5,1),background .2s}
button:active{transform:scale(.93)}
button.pri,.fab{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px;margin-top:4px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--in);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mu);margin-top:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
#cloud{flex:none;border-radius:999px;font-size:13px;padding:8px 12px}
.tabs{position:relative;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:16px 0}
.tabs button{flex:1;background:none;border:0;position:relative;z-index:1;font-weight:700;color:var(--mu);transition:color .3s,transform .18s}
.tabs button.on{color:var(--bg)}
#ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--tx);border-radius:10px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.mov{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--bd);transition:.25s;border-radius:8px}
.mov:last-child{border:0}
.l{display:flex;align-items:center;gap:12px;min-width:0}
.ic{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:800}
.ic.ingreso{background:#1c855626;color:var(--in)}.ic.gasto{background:#d8453b26;color:var(--out)}
.mov small{color:var(--mu);display:flex;align-items:center;margin-top:2px}
.mov>div:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.mov .x{background:none;border:0;color:var(--mu);padding:4px 8px}
.ch{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:1px 8px;border:1px solid var(--bd);border-radius:99px;font-size:12px}
.ch i{width:8px;height:8px;border-radius:50%}
.st{animation:pop .5s both}
.new{animation:pop .4s,flash 1.4s}
.gone{opacity:0;transform:translateX(40px)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:16px 24px;box-shadow:0 14px 28px -10px #000a;animation:pop .5s .5s both}
.seg{display:flex;gap:6px}.seg button{flex:1}
.seg button.on{color:#fff;border:0}
#sg.on{background:#d8453b}#si.on{background:#1c8556}
.empty{color:var(--mu);text-align:center;padding:22px}
#sheet,#ssh{position:fixed;inset:0;background:#0008;backdrop-filter:blur(5px);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
#sheet>.card,#ssh>.card{width:100%;max-width:640px;margin:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,1.1,.3,1)}
#a{font:700 28px "Bricolage Grotesque",system-ui}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:30;animation:pop .25s}
#toast button{background:none;border:0;color:var(--in);font-weight:800;padding:0}
.coin{position:fixed;z-index:40;pointer-events:none;font-weight:800;font-size:22px;animation:fly .9s cubic-bezier(.2,.7,.3,1) forwards}
.coin.ingreso{color:var(--in)}.coin.gasto{color:var(--out)}
.b{transform-box:fill-box;transform-origin:bottom;animation:grow .6s both}
section{animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-26px) rotate(-2deg)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes flash{from{background:#52d49b40}to{background:transparent}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}

body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font-weight:600;letter-spacing:-.005em}
button.pri,.fab{box-shadow:0 1px 0 #ffffff33 inset,0 12px 20px -12px #000}
.fab{display:flex;align-items:center;gap:8px;font-size:16px;padding:15px 22px 15px 18px}
.fab b{font:800 24px/1 "Bricolage Grotesque",system-ui;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fab:active b{transform:rotate(90deg) scale(1.2)}
label{font-weight:600;letter-spacing:.01em}
.mov>div:first-child b{font-weight:600}
.tabs button{padding:10px 2px;font-size:14px}
#ind{width:calc((100% - 8px)/3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);animation:pop .25s}
.cr{display:flex;gap:12px;align-items:center;padding:8px 0}
.ce{font-size:24px;width:34px;text-align:center}
.cn{display:flex;justify-content:space-between;gap:8px}
.cn b{font-variant-numeric:tabular-nums}
select{font-size:15px;padding-right:4px}
#sh{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));animation:fade .2s}
.shin{max-width:640px;margin:0 auto}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--in);margin:10px 0}
</style>
</head>
<body>
<main>
<div class="row" style="align-items:center"><h1>Mis gastos</h1><button id="shb" style="flex:none;border-radius:999px;font-size:13px;padding:8px 12px">👥 Pareja</button><button id="cloud" hidden style="flex:none"></button></div>

<div class="card sum hero">
<div><small>Ingresos</small><b class="in" id="sI">0,00 €</b></div>
<div><small>Gastos</small><b class="out" id="sG">0,00 €</b></div>
<div class="bal"><small>Balance</small><b id="sB">0,00 €</b></div>
</div>

<div class="row"><select id="fm"></select><select id="ff"></select></div>
<div class="row" style="margin-top:8px"><select id="fc"></select><input id="q" type="search" placeholder="Buscar…"></div>

<div class="tabs"><i id="ind"></i><button id="t1" class="on">Movimientos</button><button id="t2">Carpetas</button><button id="t3">Categorías</button></div>

<section id="v1"><div class="card" id="list"></div></section>

<section id="v2" hidden>
<div id="gen"></div>
<div id="folders"></div>
<div class="card">
<b>Nueva carpeta</b>
<label>Nombre</label><input id="fn" placeholder="Ej. Reforma, Coche, Oposición">
<label>Objetivo total (opcional, para gastos a largo plazo)</label><input id="fg" type="number" inputmode="decimal" min="0" step="0.01" placeholder="€">
<p><button class="pri" id="fadd">Crear carpeta</button></p>
</div>
<div class="card"><b>Copia de seguridad</b>
<div class="row" style="margin-top:10px"><button id="exp">Exportar</button><button id="imp">Importar</button></div>
<input type="file" id="file" accept=".json" hidden>
</div>
</section>
<section id="v3" hidden><div id="catv"></div></section>
</main>

<button class="pri fab" id="add"><b>＋</b>Añadir</button>
<div id="sh" hidden><div class="shin">
<div class="row" style="align-items:center;margin-bottom:14px"><button id="shx" style="flex:none">←</button><h1 style="margin:0;font-size:24px">Gastos compartidos</h1></div>
<div id="shc"></div>
</div></div>
<div id="ssh" hidden><div class="card">
<b style="font-size:18px">Nuevo gasto compartido</b>
<label>Importe (€)</label><input id="sa" type="number" inputmode="decimal" min="0" step="0.01">
<label>Concepto</label><input id="sc" placeholder="Ej. Cena, alquiler, súper…">
<label>Fecha</label><input id="sd" type="date">
<label>¿Quién ha pagado?</label><div class="chips" id="spay"></div>
<label>Reparto: <span id="slab"></span></label>
<input id="sp" type="range" min="0" max="100" step="5" value="50">
<div class="chips" id="spre"></div>
<div class="row" style="margin-top:16px"><button id="scx">Cancelar</button><button class="pri" id="ssv">Guardar</button></div>
</div></div>
<div id="toast" hidden></div>

<div id="sheet" hidden>
<div class="card">
<div class="seg"><button id="sg" class="on">Gasto</button><button id="si">Ingreso</button></div>
<label>Importe (€)</label><input id="a" type="number" inputmode="decimal" min="0" step="0.01">
<label>Categoría</label><div class="chips" id="cats"></div>
<label>Fecha</label><input id="d" type="date">
<label>Concepto</label><input id="c" placeholder="Ej. Gasolina, cuota del coche…">
<label>Carpeta</label><select id="f"></select>
<div class="row" style="margin-top:14px"><button id="cancel">Cancelar</button><button class="pri" id="save">Guardar</button></div>
</div></div>

<script>
// ===== Pega aquí la configuración de tu proyecto de Firebase (Configuración del proyecto → Tus apps → Web) =====
const CFG={apiKey:"AIzaSyAuJa-7EPq0QLt__eU4ab9gEJO8CdahdRg",authDomain:"gastos-e-ingresos-c7580.firebaseapp.com",projectId:"gastos-e-ingresos-c7580",appId:"1:790994953454:web:6c6c1c346cbb4198097fff"};
// =====================================================================================================

const $=id=>document.getElementById(id);
const KEY='gastos-v1',FB='https://www.gstatic.com/firebasejs/10.14.1/';
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let S={movs:[],folders:[]},tipo='gasto',cat='',last='',st=true,ref=null,unsub=null,first=false,auth=null,db=null,M={};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.movs)S.movs=[];if(!S.folders)S.folders=[];
const mk=a=>a.map(([id,e,name])=>({id,e,name}));
const DEF=()=>({gasto:mk([['g-super','🛒','Supermercado'],['g-comida','🍽️','Comer fuera'],['g-transp','🚗','Transporte'],['g-hogar','🏠','Hogar'],['g-ocio','🎉','Ocio'],['g-salud','💊','Salud'],['g-ropa','👕','Ropa'],['g-otros','📦','Otros']]),ingreso:mk([['i-trabajo','💼','Trabajo'],['i-venta','🏷️','Ventas'],['i-regalo','🎁','Regalo'],['i-otros','📦','Otros']])});
function ensureG(){if(!S.cats)S.cats=DEF();if(!S.folders.some(f=>f.id==='general'))S.folders.unshift({id:'general',name:'General',goal:0});S.movs.forEach(x=>{if(!x.folder)x.folder='general'})}
ensureG();
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function save(){store();if(ref)M.FS.setDoc(ref,S).catch(()=>{})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=s=>{const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const catById=id=>[...S.cats.gasto,...S.cats.ingreso].find(c=>c.id===id);
const fname=id=>(S.folders.find(f=>f.id===id)||{}).name||'General';
const sum=(L,t)=>L.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);
const buzz=()=>navigator.vibrate&&navigator.vibrate(12);
const NC=['#8a8f98','#d8453b','#3568c9','#e8892b','#2e9a62','#e6b822'];
const fc=id=>NC[Math.max(0,S.folders.findIndex(f=>f.id===id))%6];
function burst(t){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const r=$('add').getBoundingClientRect(),x=r.left+r.width/2,y=r.top;
 for(let k=0;k<12;k++){const e=document.createElement('span');e.className='coin '+t;e.textContent='€';
  e.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*240}px;--dy:${-70-Math.random()*170}px`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
}
const merge=(a,b)=>[...new Map([...a,...b].map(x=>[x.id,x])).values()];

function tween(el,to){
 const f=el._v||0;el._v=to;
 if(f===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=eur(to);return}
 const t0=performance.now();
 (function s(t){const p=Math.min(1,(t-t0)/500);el.textContent=eur(f+(to-f)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0);
}
let tt;
function toast(msg,fn){
 clearTimeout(tt);const t=$('toast');
 t.innerHTML='<span>'+msg+'</span>'+(fn?'<button id="un">Deshacer</button>':'');t.hidden=false;
 if(fn)$('un').onclick=()=>{fn();t.hidden=true};
 tt=setTimeout(()=>t.hidden=true,4500);
}
function opts(){
 const months=[...new Set(S.movs.map(m=>m.date.slice(0,7)))].sort().reverse();
 const cm=$('fm').value,cf=$('ff').value;
 $('fm').innerHTML='<option value="">Todos los meses</option>'+months.map(m=>`<option value="${m}">${MES[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('');
 $('fm').value=months.includes(cm)?cm:'';
 const fo=S.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');
 $('ff').innerHTML='<option value="">Todas carpetas</option>'+fo;
 $('ff').value=S.folders.some(f=>f.id===cf)?cf:'';
 const cc=$('fc').value,co=a=>a.map(c=>`<option value="${c.id}">${c.e} ${esc(c.name)}</option>`).join('');
 $('fc').innerHTML='<option value="">Todas categorías</option><optgroup label="Gastos">'+co(S.cats.gasto)+'</optgroup><optgroup label="Ingresos">'+co(S.cats.ingreso)+'</optgroup>';
 $('fc').value=catById(cc)?cc:'';
 $('f').innerHTML=fo;
}
function filtered(){
 const m=$('fm').value,f=$('ff').value,c=$('fc').value,q=$('q').value.trim().toLowerCase();
 return S.movs.filter(x=>(!m||x.date.startsWith(m))&&(!f||x.folder===f)&&(!c||x.cat===c)&&(!q||(x.concept||'').toLowerCase().includes(q)))
  .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}
function chart(){
 const now=new Date(),ms=[];
 for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
 const v=ms.map(m=>{const L=S.movs.filter(x=>x.date.startsWith(m));return[sum(L,'ingreso'),sum(L,'gasto')]});
 const mx=Math.max(1,...v.flat());
 return `<svg viewBox='0 0 300 120' width='100%' role='img' aria-label='Ingresos y gastos de los últimos 6 meses'>`+ms.map((m,i)=>{
  const x=i*50+7;
  return v[i].map((a,t)=>{const h=a/mx*90;return `<rect class='b' x='${x+t*18}' y='${100-h}' width='16' height='${h}' rx='3' fill='var(${t?'--out':'--in'})' style='animation-delay:${i*60}ms'/>`}).join('')
   +`<text x='${x+17}' y='115' text-anchor='middle' font-size='10' fill='var(--mu)'>${MES[+m.slice(5)-1].slice(0,3)}</text>`}).join('')+`</svg>`;
}
const N=(v,c)=>`<b class='${c}' data-n='${v}'>${eur(v)}</b>`;
function render(){
 const L=filtered(),i=sum(L,'ingreso'),g=sum(L,'gasto');
 tween($('sI'),i);tween($('sG'),g);tween($('sB'),i-g);
 $('sB').className=i-g<0?'out':'in';
 $('list').innerHTML=L.length?L.map((x,k)=>`<div class="mov${x.id===last?' new':st?' st':''}" id="r${x.id}"${st?` style="animation-delay:${Math.min(k,10)*45}ms"`:''}><div class="l"><i class="ic ${x.type}">${(catById(x.cat)||{}).e||(x.type==='ingreso'?'↗':'↙')}</i><div><b>${esc(x.concept||(catById(x.cat)||{}).name||(x.type==='gasto'?'Gasto':'Ingreso'))}</b><small>${fdate(x.date)}<span class="ch"><i style="background:${fc(x.folder)}"></i>${esc(fname(x.folder))}</span></small></div></div><div><b class="${x.type==='ingreso'?'in':'out'}">${x.type==='ingreso'?'+':'−'}${eur(x.amount)}</b><button class="x" data-d="${x.id}" aria-label="Borrar">✕</button></div></div>`).join(''):'<div class="empty">Aún no hay movimientos. Pulsa «+ Añadir».</div>';
 last='';st=false;
 const ti=sum(S.movs,'ingreso'),tg=sum(S.movs,'gasto');
 $('gen').innerHTML=`<div class='card' style='border-color:var(--ac)'><b>Balance general</b><div class='mu'>Todas las carpetas</div><div class='mu' style='margin-top:6px'>Ingresos ${N(ti,'in')} · Gastos ${N(tg,'out')}</div><div style='margin-top:6px;font-size:22px'>${N(ti-tg,ti-tg<0?'out':'in')}</div>${ti-tg<0?`<div class='mu out'>Has gastado ${eur(tg-ti)} más de lo que has ingresado</div>`:''}</div>
 <div class='card'><b>Últimos 6 meses</b> <span class='mu'><span class='in'>●</span> ingresos <span class='out'>●</span> gastos</span>${chart()}</div>`;
 $('folders').innerHTML=S.folders.map(f=>{
  const FM=S.movs.filter(x=>x.folder===f.id),gi=sum(FM,'ingreso'),gg=sum(FM,'gasto');
  const mm=new Set(FM.filter(x=>x.type==='gasto').map(x=>x.date.slice(0,7))).size;
  const est=f.goal&&gg>0&&gg<f.goal?Math.ceil((f.goal-gg)/(gg/mm)):0;
  return `<div class="card" style="border-left:5px solid ${fc(f.id)}"><div class="mov" style="border:0;padding:0"><b>${esc(f.name)}</b>${f.id==='general'?'':`<button class="x" data-df="${f.id}" aria-label="Borrar carpeta">✕</button>`}</div>
  <div class='mu' style='margin-top:6px'>Ingresos ${N(gi,'in')} · Gastos ${N(gg,'out')}</div>
  <div style='margin-top:6px'>Balance: ${N(gi-gg,gi-gg<0?'out':'in')}</div>
  ${gi-gg<0?`<div class='mu out'>Más gastos que ingresos: ${eur(gg-gi)}</div>`:''}
  ${f.goal?`<div class="bar"><i style="width:0;background:${fc(f.id)}" data-w="${Math.min(100,gg/f.goal*100)}"></i></div><div class='mu'>Pagado ${eur(gg)} de ${eur(f.goal)} · faltan ${eur(Math.max(0,f.goal-gg))}</div>`:''}
  ${est?`<div class='mu'>A este ritmo: ~${est} ${est===1?'mes':'meses'} para terminar</div>`:''}</div>`}).join('');
 $('catv').innerHTML=catView(L);
 document.querySelectorAll('[data-n]').forEach(e=>{e._v=0;tween(e,+e.dataset.n)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')));
}
function catView(L){
 const blk=(t,title,col)=>{
  const T=L.filter(x=>x.type===t),tot=sum(T,t),by={};
  T.forEach(x=>by[x.cat||'']=(by[x.cat||'']||0)+x.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  return `<div class='card'><b>${title}</b> <span class='mu'>${eur(tot)}</span>`+(rows.length?rows.map(([id,v])=>{const c=catById(id)||{e:'•',name:'Sin categoría'};return `<div class='cr'><span class='ce'>${c.e}</span><div style='flex:1'><div class='cn'><span>${esc(c.name)}</span><b>${eur(v)}</b></div><div class='bar'><i style='width:0;background:${col}' data-w='${v/tot*100}'></i></div></div></div>`}).join(''):`<div class='empty'>Sin ${t==='gasto'?'gastos':'ingresos'} en este periodo</div>`)+`</div>`};
 return `<div class='mu' style='margin:0 0 10px'>Según el mes y la carpeta que tengas filtrados arriba</div>`+blk('gasto','En qué gastas','var(--out)')+blk('ingreso','De dónde ingresas','var(--in)');
}
function refresh(){opts();render()}
function setTab(n){st=true;$('ind').style.transform='translateX('+(n-1)*100+'%)';[1,2,3].forEach(i=>{$('v'+i).hidden=i!==n;$('t'+i).className=i===n?'on':''});$('add').hidden=n!==1;if(n>1)render()}
function drawCats(){$('cats').innerHTML=S.cats[tipo].map(c=>`<button class="chip${c.id===cat?' on':''}" data-c="${c.id}">${c.e} ${esc(c.name)}</button>`).join('')+'<button class="chip" data-c="+">＋ Nueva</button>'}
function setTipo(t){tipo=t;cat='';drawCats();$('sg').className=t==='gasto'?'on':'';$('si').className=t==='ingreso'?'on':''}
$('t1').onclick=()=>setTab(1);$('t2').onclick=()=>setTab(2);$('t3').onclick=()=>setTab(3);
$('sg').onclick=()=>setTipo('gasto');$('si').onclick=()=>setTipo('ingreso');
$('add').onclick=()=>{$('a').value='';$('c').value='';$('d').value=today();const f=$('ff').value;$('f').value=S.folders.some(x=>x.id===f)?f:'general';setTipo('gasto');$('sheet').hidden=false;$('a').focus()};
$('cancel').onclick=()=>$('sheet').hidden=true;
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').hidden=true};
$('save').onclick=()=>{
 const a=parseFloat($('a').value);
 if(!(a>0)){$('a').focus();return}
 const id=uid();last=id;
 S.movs.push({id,type:tipo,amount:a,date:$('d').value||today(),concept:$('c').value.trim(),folder:$('f').value||'general',cat});
 save();buzz();burst(tipo);$('sheet').hidden=true;refresh();
};
$('fadd').onclick=()=>{
 const n=$('fn').value.trim();if(!n)return;
 S.folders.push({id:uid(),name:n,goal:parseFloat($('fg').value)||0});
 $('fn').value='';$('fg').value='';save();buzz();refresh();
};
document.addEventListener('click',e=>{
 const d=e.target.dataset.d,df=e.target.dataset.df,dc=e.target.dataset.c;
 if(dc==='+'){const n=prompt('Nombre de la categoría (puedes empezar con un emoji)');if(n&&n.trim()){const id=(tipo==='gasto'?'g':'i')+uid();S.cats[tipo].push({id,e:'🏷️',name:n.trim()});cat=id;save();drawCats()}}
 else if(dc){cat=cat===dc?'':dc;drawCats()}
 if(d){
  const m=S.movs.find(x=>x.id===d),row=$('r'+d);if(row)row.classList.add('gone');
  setTimeout(()=>{S.movs=S.movs.filter(x=>x.id!==d);save();refresh();toast('Movimiento borrado',()=>{S.movs.push(m);save();refresh()})},250);
 }
 if(df&&confirm('¿Borrar la carpeta? Sus movimientos pasarán a General.')){S.folders=S.folders.filter(x=>x.id!==df);S.movs.forEach(x=>{if(x.folder===df)x.folder='general'});save();refresh()}
});
$('fm').onchange=$('ff').onchange=$('fc').onchange=$('q').oninput=render;
$('exp').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='gastos-'+today()+'.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.movs&&j.folders&&confirm('Esto reemplazará los datos actuales. ¿Continuar?')){S=j;ensureG();save();refresh()}}catch(x){alert('Archivo no válido')}};if(e.target.files[0])r.readAsText(e.target.files[0])};

// ----- Gastos compartidos (pareja) -----
let G=null,gref=null,gunsub=null,pend=null,spay='';
const gcode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(10)),v=>A[v%32]).join('')};
const r2=x=>Math.round(x*100)/100;
function gcalc(){
 const n={a:0,b:0},paid={a:0,b:0},share={a:0,b:0};let tot=0;
 (G.exps||[]).forEach(e=>{const a=e.amount*e.pa/100,b=e.amount-a;tot+=e.amount;paid[e.payer]+=e.amount;share.a+=a;share.b+=b;n[e.payer]+=e.amount;n.a-=a;n.b-=b});
 (G.pays||[]).forEach(p=>{n[p.from]+=p.amount;n[p.to]-=p.amount});
 return{n,tot,paid,share};
}
function openShared(){
 $('sh').hidden=false;if(gunsub){gunsub();gunsub=null}G=null;
 if(auth&&auth.currentUser&&S.grp){
  gref=M.FS.doc(db,'grupos',S.grp.id);
  gunsub=M.FS.onSnapshot(gref,x=>{G=x.exists()?x.data():null;drawShared()},()=>{G=null;drawShared()});
 }else drawShared();
}
function drawShared(){
 const o=$('shc'),u=auth&&auth.currentUser;
 if(!auth){o.innerHTML="<div class='card'>Para compartir gastos hace falta la sincronización: pega tu configuración de Firebase en <b>index.html</b> (mira el LEEME).</div>";return}
 if(!u){o.innerHTML="<div class='card'><b>Inicia sesión</b><p class='mu'>Cada uno entra con su cuenta de Google y compartís el grupo con un código.</p><button class='pri' data-act='login'>Iniciar sesión con Google</button></div>";return}
 if(!S.grp){
  o.innerHTML=pend?`<div class='card'><b>¿Quién eres?</b><div class='chips'>${['a','b'].map(i=>`<button class='chip' data-act='iam' data-id='${i}'>${esc(pend.names[i])}</button>`).join('')}</div></div>`
  :"<div class='card'><b>Crear grupo con tu pareja</b><label>Tu nombre</label><input id='gn1' placeholder='Ej. Pablo'><label>Nombre de tu pareja</label><input id='gn2' placeholder='Ej. Marta'><p><button class='pri' data-act='create'>Crear grupo</button></p></div><div class='card'><b>¿Ya te han dado un código?</b><label>Código</label><input id='gcode' placeholder='XXXXX-XXXXX' autocapitalize='characters'><p><button data-act='join'>Unirme</button></p></div>";
  return}
 if(!G){o.innerHTML="<div class='card'>Cargando grupo…<p><button data-act='leave'>Salir del grupo</button></p></div>";return}
 const me=S.grp.me,ot=me==='a'?'b':'a',nm=G.names,c=gcalc(),net=r2(c.n[me]);
 const hi=net===0?'Estáis en paz ✓':net>0?`${esc(nm[ot])} te debe`:`Debes a ${esc(nm[ot])}`;
 const items=[...(G.exps||[]).map(x=>({...x,k:'e'})),...(G.pays||[]).map(x=>({...x,k:'p'}))].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 const row=x=>x.k==='e'
  ?`<div class='mov'><div class='l'><i class='ic gasto'>🧾</i><div><b>${esc(x.desc||'Gasto')}</b><small>${fdate(x.date)}<span class='ch'>Pagó ${esc(nm[x.payer])}</span></small></div></div><div><b>${eur(x.amount)}</b><small style='justify-content:flex-end'>tu parte ${eur(x.amount*(me==='a'?x.pa:100-x.pa)/100)}</small></div><button class='x' data-act='del' data-k='e' data-id='${x.id}' aria-label='Borrar'>✕</button></div>`
  :`<div class='mov'><div class='l'><i class='ic ingreso'>💸</i><div><b>${esc(nm[x.from])} pagó a ${esc(nm[x.to])}</b><small>${fdate(x.date)}</small></div></div><div><b class='in'>${eur(x.amount)}</b></div><button class='x' data-act='del' data-k='p' data-id='${x.id}' aria-label='Borrar'>✕</button></div>`;
 const id=S.grp.id;
 o.innerHTML=`<div class='card' style='background:var(--tx);color:var(--bg);border:0'>
 <div style='opacity:.75'>${hi}</div>
 ${net?`<b data-n='${Math.abs(net)}' style='display:block;font:700 44px/1.15 "Bricolage Grotesque",system-ui;letter-spacing:-.03em;font-variant-numeric:tabular-nums'>${eur(Math.abs(net))}</b><button data-act='settle' style='margin-top:12px;background:var(--bg);color:var(--tx)'>Marcar como pagado</button>`:''}
 <div style='opacity:.7;font-size:13px;margin-top:12px'>Gasto total ${eur(c.tot)} · Has pagado ${eur(c.paid[me])} · Tu parte ${eur(c.share[me])}</div></div>
 <button class='pri' data-act='add' style='width:100%;margin-bottom:14px'>＋ Nuevo gasto compartido</button>
 <div class='card'>${items.length?items.map(row).join(''):"<div class='empty'>Aún no hay gastos compartidos</div>"}</div>
 <div class='card'><b>Grupo</b><div class='mu'>Código para que tu pareja se una</div><div style='font:700 24px "Bricolage Grotesque",system-ui;letter-spacing:.08em;margin:6px 0 12px'>${id.slice(0,5)}-${id.slice(5)}</div><div class='row'><button data-act='copy'>Copiar código</button><button data-act='leave'>Salir del grupo</button></div></div>`;
 o.querySelectorAll('[data-n]').forEach(e=>{e._v=0;tween(e,+e.dataset.n)});
}
function drawSp(){
 const me=S.grp.me,ot=me==='a'?'b':'a',nm=G.names,v=+$('sp').value,a=parseFloat($('sa').value)||0;
 $('spay').innerHTML=[me,ot].map(i=>`<button class='chip${spay===i?' on':''}' data-py='${i}'>${i===me?'Yo':esc(nm[i])}</button>`).join('');
 $('slab').textContent=`Yo ${v}% (${eur(a*v/100)}) · ${nm[ot]} ${100-v}% (${eur(a*(100-v)/100)})`;
 $('spre').innerHTML=[50,60,70,100,0].map(p=>`<button class='chip${v===p?' on':''}' data-pr='${p}'>${p}/${100-p}</button>`).join('');
}
$('shb').onclick=openShared;
$('shx').onclick=()=>{$('sh').hidden=true;if(gunsub){gunsub();gunsub=null}};
$('sp').oninput=$('sa').oninput=drawSp;
$('scx').onclick=()=>$('ssh').hidden=true;
$('ssh').onclick=e=>{
 if(e.target.id==='ssh')$('ssh').hidden=true;
 if(e.target.dataset.py){spay=e.target.dataset.py;drawSp()}
 if(e.target.dataset.pr){$('sp').value=e.target.dataset.pr;drawSp()}
};
$('ssv').onclick=()=>{
 const a=parseFloat($('sa').value);if(!(a>0)){$('sa').focus();return}
 const v=+$('sp').value,x={id:uid(),desc:$('sc').value.trim(),amount:a,date:$('sd').value||today(),payer:spay,pa:S.grp.me==='a'?v:100-v};
 $('ssh').hidden=true;buzz();
 M.FS.updateDoc(gref,{exps:M.FS.arrayUnion(x)}).catch(()=>toast('No se pudo guardar'));
};
$('sh').onclick=async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,FS=M.FS;
 if(a==='login'){try{await M.AU.signInWithPopup(auth,new M.AU.GoogleAuthProvider());openShared()}catch(x){toast('No se pudo iniciar sesión')}}
 if(a==='create'){
  const n1=$('gn1').value.trim(),n2=$('gn2').value.trim();if(!n1||!n2)return toast('Escribe los dos nombres');
  const id=gcode();
  try{await FS.setDoc(FS.doc(db,'grupos',id),{names:{a:n1,b:n2},exps:[],pays:[]});S.grp={id,me:'a'};save();buzz();openShared()}
  catch(x){toast('No se pudo crear. ¿Has publicado las reglas nuevas?')}
 }
 if(a==='join'){
  const id=$('gcode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  try{const g=await FS.getDoc(FS.doc(db,'grupos',id));if(!g.exists())return toast('Código no encontrado');pend={id,names:g.data().names};drawShared()}
  catch(x){toast('No se pudo comprobar el código')}
 }
 if(a==='iam'){S.grp={id:pend.id,me:t.dataset.id};pend=null;save();openShared()}
 if(a==='add'){spay=S.grp.me;$('sa').value='';$('sc').value='';$('sd').value=today();$('sp').value=50;drawSp();$('ssh').hidden=false;$('sa').focus()}
 if(a==='settle'){
  const me=S.grp.me,ot=me==='a'?'b':'a',net=r2(gcalc().n[me]);if(!net)return;
  const from=net<0?me:ot,to=net<0?ot:me,p={id:uid(),from,to,amount:Math.abs(net),date:today()};
  if(confirm(`¿Registrar que ${G.names[from]} ha pagado ${eur(p.amount)} a ${G.names[to]}?`))FS.updateDoc(gref,{pays:FS.arrayUnion(p)}).then(buzz).catch(()=>toast('No se pudo guardar'));
 }
 if(a==='copy'){if(navigator.clipboard)navigator.clipboard.writeText(S.grp.id);toast('Código copiado')}
 if(a==='leave'&&confirm('¿Salir del grupo? Los gastos siguen guardados para tu pareja.')){delete S.grp;save();if(gunsub){gunsub();gunsub=null}G=null;drawShared()}
 if(a==='del'){
  const k=t.dataset.k==='e'?'exps':'pays',o=(G[k]||[]).find(x=>x.id===t.dataset.id);if(!o)return;
  FS.updateDoc(gref,{[k]:FS.arrayRemove(o)}).then(()=>toast('Borrado',()=>FS.updateDoc(gref,{[k]:FS.arrayUnion(o)})));
 }
};

// ----- Sincronización (Firebase) -----
const setCloud=on=>$('cloud').textContent=on?'☁️ Sincronizado':'☁️ Iniciar sesión';
async function initCloud(){
 if(!CFG.apiKey)return;
 try{
  const [A,AU,FS]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
  const app=A.initializeApp(CFG);auth=AU.getAuth(app);
  db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache()});
  M={AU,FS};$('cloud').hidden=false;setCloud(false);
  AU.onAuthStateChanged(auth,u=>{
   if(unsub){unsub();unsub=null}ref=null;
   if(!u){setCloud(false);return}
   setCloud(true);ref=FS.doc(db,'gastos',u.uid);first=true;
   unsub=FS.onSnapshot(ref,s=>{
    if(s.metadata.hasPendingWrites)return;
    const d=s.exists()?s.data():{};
    if(first){first=false;S={movs:merge(d.movs||[],S.movs),folders:merge(d.folders||[],S.folders),cats:d.cats||S.cats,grp:d.grp||S.grp};ensureG();store();FS.setDoc(ref,S).catch(()=>{})}
    else{S={movs:d.movs||[],folders:d.folders||[],cats:d.cats||S.cats,grp:d.grp||S.grp};ensureG();store()}
    refresh();
   });
  });
 }catch(e){}
}
$('cloud').onclick=async()=>{
 if(!auth)return;const AU=M.AU;
 if(auth.currentUser){if(confirm('¿Cerrar sesión? Tus datos seguirán en la nube.'))AU.signOut(auth)}
 else{try{await AU.signInWithPopup(auth,new AU.GoogleAuthProvider())}catch(e){toast('No se pudo iniciar sesión')}}
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
refresh();initCloud();
</script>
